<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ankur Singh</title>
  <desc id="desc">Computer Science student focused on AI and machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1110"/>
      <stop offset=".55" stop-color="#101a16"/>
      <stop offset="1" stop-color="#17251d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9bd28d" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9bd28d"/>
      <stop offset="1" stop-color="#9bd28d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b5d8bb" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="970" cy="145" rx="215" ry="130" fill="#6ea77b" opacity=".12" filter="url(#blur)"/>
  <path d="M0 255 C260 225 380 290 620 255 S990 220 1200 250" fill="none" stroke="#9bd28d" stroke-opacity=".12"/>
  <path d="M0 263 C260 233 380 298 620 263 S990 228 1200 258" fill="none" stroke="#9bd28d" stroke-opacity=".1"/>
  <g fill="#c8e7c4">
    <circle cx="720" cy="48" r="2" opacity=".55"><animate attributeName="opacity" values=".2;.85;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="785" cy="226" r="1.8" opacity=".5"><animate attributeName="opacity" values=".8;.2;.8" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="58" r="2" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="665" cy="195" r="1.5" opacity=".45"><animate attributeName="opacity" values=".7;.15;.7" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(74 72)">
    <text x="0" y="0" fill="#a7c5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">HELLO, I'M</text>
    <text x="-2" y="78" fill="#f0f5ef" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Ankur Singh</text>
    <rect x="0" y="101" width="390" height="2" rx="1" fill="url(#glow)">
      <animate attributeName="width" values="95;390;180;390" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="139" fill="#c1d0c1" font-family="Inter, Arial, sans-serif" font-size="19">Computer Science  /  AI &amp; Machine Learning</text>
    <text x="0" y="172" fill="#91b694" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1">GLA UNIVERSITY · INDIA</text>
  </g>
  <g transform="translate(820 58)">
    <rect width="305" height="184" rx="13" fill="#0a100e" fill-opacity=".78" stroke="#53775c" stroke-opacity=".65"/>
    <path d="M0 38H305" stroke="#53775c" stroke-opacity=".45"/>
    <circle cx="19" cy="19" r="4" fill="#e18b7a"/>
    <circle cx="34" cy="19" r="4" fill="#d9bb76"/>
    <circle cx="49" cy="19" r="4" fill="#87b98c"/>
    <text x="20" y="68" fill="#86a98a" font-family="ui-monospace, monospace" font-size="12">~/ankur</text>
    <text x="20" y="98" fill="#e4eee3" font-family="ui-monospace, monospace" font-size="13">$ git status</text>
    <text x="20" y="122" fill="#9ecb9d" font-family="ui-monospace, monospace" font-size="13">learning new things</text>
    <text x="20" y="145" fill="#9ecb9d" font-family="ui-monospace, monospace" font-size="13">building small projects</text>
    <text x="20" y="168" fill="#9ecb9d" font-family="ui-monospace, monospace" font-size="13">improving every day<tspan fill="#f0f5ef"> _<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>